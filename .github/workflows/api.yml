name: api + agent

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same pull request; pushing twice used to run
# both to completion. Keyed by SHA on push so a branch/main run is never
# cancelled — cancellation follows workflow start order, not commit order, so
# cancelling a push run risks the newest commit never being the one validated.
concurrency:
  group: api-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app

      - name: Test
        run: pytest -q
        continue-on-error: true # tests don't exist yet at scaffold time

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check agent scripts

      - name: Test
        run: pytest -q
