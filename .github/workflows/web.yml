name: web

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same pull request; pushing twice used to run
# both to completion. Keyed by SHA on push so a branch/main run is never
# cancelled — cancellation follows workflow start order, not commit order, so
# cancelling a push run risks the newest commit never being the one validated.
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages/shared
        run: pnpm --filter @cratedigger/shared typecheck

      - name: Typecheck packages/db
        run: pnpm --filter @cratedigger/db typecheck

      - name: Typecheck apps/web
        run: pnpm --filter @cratedigger/web typecheck

      - name: Build apps/web
        run: pnpm --filter @cratedigger/web build
        env:
          # Build needs *some* value for these even though they're not used at compile time.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
          DATABASE_URL: postgresql://cratedigger:cratedigger@localhost:5432/cratediggerdb
