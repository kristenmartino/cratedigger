name: rebuild taste profile

# Rebuilds taste_profile rows from per-user seed files at
# services/agent/data/seeds/<clerk_id>.json.
#
# Triggers:
#   - workflow_dispatch with `clerk_id` input  — rebuild one user
#   - push to main with changes under data/seeds/**           — rebuild --all
#
# Required repo secrets:
#   DATABASE_URL    — Neon connection string
#   VOYAGE_API_KEY  — for embedding the seed artists
#
# Scope: ONLY rebuilds taste_profiles rows. Does NOT re-seed users,
# sources, or issue fixtures. Safe to re-run any number of times.

on:
  workflow_dispatch:
    inputs:
      clerk_id:
        description: "Clerk-mapped user id to rebuild (e.g. user_kristen_seed_v1). Leave blank to rebuild every seed file."
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "services/agent/data/seeds/**"
      - "services/agent/scripts/rebuild_taste_profile.py"
      - ".github/workflows/rebuild-taste-profile.yml"

# Serialize, never cancel. This workflow changes state rather than reporting on
# it, so an interrupted run is worse than a queued one.
concurrency:
  group: rebuild-taste-profile
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: services/agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild taste profile(s)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          CLERK_ID: ${{ github.event.inputs.clerk_id }}
        run: |
          set -e
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL repo secret is not set"
            exit 1
          fi
          if [ -z "${VOYAGE_API_KEY:-}" ]; then
            echo "::error::VOYAGE_API_KEY repo secret is not set"
            exit 1
          fi

          # Manual fire with a clerk_id → rebuild just that user.
          # Path-trigger (push) leaves CLERK_ID empty → rebuild --all.
          if [ -n "${CLERK_ID}" ]; then
            echo "Rebuilding profile for clerk_id=${CLERK_ID}"
            python scripts/rebuild_taste_profile.py --clerk-id "${CLERK_ID}"
          else
            echo "Rebuilding every profile in data/seeds/"
            python scripts/rebuild_taste_profile.py --all
          fi

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Rebuild taste profile"
            echo
            echo "- Source: \`services/agent/data/seeds/<clerk_id>.json\` files"
            echo "- Target: \`taste_profiles\` rows in Neon"
            if [ -n "${{ github.event.inputs.clerk_id }}" ]; then
              echo "- Mode: single user (\`${{ github.event.inputs.clerk_id }}\`)"
            else
              echo "- Mode: rebuild all seed files (push-trigger)"
            fi
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "Status: ✅ rebuilt — next Sunday cron scores against the new centroid(s)"
            else
              echo "Status: ❌ failed — check the step log above"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
